name: timetrack2
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  crypto: ^3.0.7
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  get_it: ^9.2.1
  go_router: ^17.4.0
  http: ^1.6.0
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  # **直接固定传递依赖 postgrest**（supabase_flutter → supabase 2.16.0 精确
  # 固定 2.9.1）：其内部"POST 不被 SDK 内层重试、GET 内层重试"策略被测试的
  # 精确计数断言依赖（见 remote_tables_retry_test.dart 文件头）——直接声明
  # 使版本意图显式可见、防 supabase 未来放宽约束时 postgrest 静默升级改变
  # 该行为（断言会失败提示，但需先核验版本）。
  postgrest: 2.9.1
  # **直接固定传递依赖 gotrue**（supabase 2.16.0 精确固定 2.27.1）：auth
  # 契约测试（supabase_auth_service_test.dart）深度耦合 gotrue 内部行为
  #（有会话 local scope signOut 发 POST /logout、AuthResponse.fromJson 解析键、
  # verifyOTP 广播时序）——直接声明使版本意图显式可见、防 supabase 放宽
  # 约束时 gotrue 静默升级导致契约测试以误导性方式集体失败。
  gotrue: 2.27.1
  sqlite3: ^3.5.1
  supabase_flutter: ^2.17.1
  uuid: ^4.6.0
  archive: ^4.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.5
  # 仅测试用：supabase_flutter 的 GoTrueClient 经 shared_preferences 持久化
  # 会话（传递依赖），测试用 setMockInitialValues 重置存储保证用例顺序无关。
  # 运行期仍无 shared_preferences（技术选型：数据落 app_metadata 表）。
  shared_preferences: ^2.5.4

flutter:
  uses-material-design: true
